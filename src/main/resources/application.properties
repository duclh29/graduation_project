spring.application.name=graduationproject
spring.data.mongodb.uri=mongodb://localhost:27017/shoe_store

jwt.secret=graduationproject-super-secret-key-for-jwt-token-signing-2026
jwt.expiration=900000
jwt.refresh-expiration=604800000
jwt.refresh-secret=graduationproject-refresh-secret-key-for-jwt-token-signing-2026

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.upload.dir=uploads/products
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-seconds=60

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#spring.cache.type=redis
#spring.data.redis.host=localhost
#spring.data.redis.port=6379

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
payment.vnpay.tmn-code=YOUR_VNPAY_TMN_CODE
payment.vnpay.hash-secret=YOUR_VNPAY_HASH_SECRET
payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.return-url=http://localhost:8080/api/payments/vnpay/return
payment.vnpay.ipn-url=http://localhost:8080/api/payments/vnpay/ipn

payment.momo.partner-code=YOUR_MOMO_PARTNER_CODE
payment.momo.access-key=YOUR_MOMO_ACCESS_KEY
payment.momo.secret-key=YOUR_MOMO_SECRET_KEY
payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
payment.momo.return-url=http://localhost:5173/checkout
payment.momo.ipn-url=http://localhost:8080/api/payments/momo/ipn

payment.vnpay.frontend-return-url=http://localhost:3000/payment-result

payment.vnpay.demo-mode=true
payment.vnpay.demo-pay-url=http://localhost:8080/api/payments/vnpay/demo-pay
